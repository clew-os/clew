[project]
name = "clew-cli"
version = "0.9.0"
description = "Command line client for clew (device-flow login, trace, shipments, incidents)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.17",
  "httpx>=0.28",
]

[project.scripts]
clew = "clew_cli.main:app"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clew_cli"]

[tool.pytest.ini_options]
markers = ["e2e: needs the running stack and a token (CLEW_TOKEN)"]
